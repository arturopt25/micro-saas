services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: micro_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d micro_saas']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
